# ================================
# 1. Application Name
# ================================
spring.application.name=simple-retrieval-augmented-generation
# This sets the name of the Spring Boot application.
# Useful for logging, monitoring, or when running multiple services.

# ================================
# 2. Google Gemini Config (Chat Model)
# ================================
spring.ai.google.genai.api-key=AIyourkey
# API key for Google Gemini (GenAI). Replace "AIyourkey" with your actual key.
# Best practice: store this in an environment variable for security.

spring.ai.google.genai.chat.options.model=gemini-2.5-flash
# Defines which Gemini model to use for chat/text generation.
# "gemini-2.5-flash" is optimized for speed and efficiency.

# ================================
# 3. Google Gemini Config (Embedding Model)
# ================================
spring.ai.google.genai.embedding.api-key=AIyourkey
# API key for embedding model (can be same as chat key).

spring.ai.google.genai.embedding.text.options.model=text-embedding-004
# Embedding model converts text into numerical vectors (used for semantic search).
# "text-embedding-004" is a Gemini embedding model.

# ================================
# 4. PostgreSQL Database Connection
# ================================
spring.datasource.url=jdbc:postgresql://pg-yoururl
# JDBC connection string for PostgreSQL database.
# Replace "pg-yoururl" with your actual Aiven/Postgres host URL.

spring.datasource.username=avnadmin
# Database username (provided by Aiven or your Postgres setup).

spring.datasource.password=Ayourpassword
# Database password (provided by Aiven or your Postgres setup).

spring.datasource.driver-class-name=org.postgresql.Driver
# Explicitly specify the PostgreSQL driver class.

# ================================
# 5. Vector Store (pgvector) Settings
# ================================
spring.ai.vectorstore.pgvector.dimensions=768
# Defines the embedding vector size (768 dimensions).
# Must match the output size of the embedding model (text-embedding-004).

spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
# Defines how similarity is calculated between vectors.
# COSINE_DISTANCE ? measures angle similarity (common for embeddings).

spring.ai.vectorstore.pgvector.initialize-schema=true
# Automatically creates the 'vector_store' table if it doesn?t exist.
# Helpful for first-time setup.

# ================================
# 6. JPA / Hibernate Configuration
# ================================
spring.jpa.hibernate.ddl-auto=update
# Automatically updates the database schema based on entity classes.
# Options: none, validate, update, create, create-drop.
# "update" is convenient for development but not recommended for production.

spring.jpa.show-sql=true
# Logs SQL queries executed by Hibernate (useful for debugging).

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Tells Hibernate to use PostgreSQL-specific SQL dialect.